name: TBB
options:
  bundleIdPrefix: org.garaged
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  TBBFoundation:
    type: framework.static
    platform: iOS
    sources:
      - path: Sources/TBBFoundation
  TBB:
    type: application
    platform: iOS
    sources:
      - path: Sources/TBBAppShell
      - path: Apps/TBB
    dependencies:
      - target: TBBFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.garaged.TBB
        PRODUCT_NAME: TBB
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Thy Budget Buddy"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to unlock your private budget."
  TBBFoundationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TBBFoundationTests
    dependencies:
      - target: TBBFoundation
schemes:
  TBB:
    build:
      targets:
        TBB: all
        TBBFoundationTests: [test]
    test:
      targets:
        - TBBFoundationTests
